<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Too many attempts — TurboFlows</title>
  <!-- Served by Rack::Attack before any Rails asset is available, so it cannot
       load the design tokens. System colours follow the viewer's theme instead
       of hardcoding one. -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 28rem;
      padding: 2rem 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0 0 1rem;
    }
    a {
      color: LinkText;
    }
  </style>
</head>
<body>
  <main>
    <h1>Too many attempts</h1>
    <p>TurboFlows paused this for a moment. Wait a minute, then try again.</p>
    <p>Nothing is lost: a workflow you were running is saved where you left it.</p>
    <p><a href="/">Back to TurboFlows</a></p>
  </main>
</body>
</html>

# Production terminates TLS in a host nginx `stream` block and forwards raw TCP
# to kamal-proxy. Stream proxying cannot set X-Forwarded-For or
# X-Forwarded-Proto, which is why production runs with ASSUME_SSL=true and why
# every request reaches Rails from one address. This reproduces that hop.
worker_processes 1;

events {
  worker_connections 1024;
}

stream {
  server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/replica.crt;
    ssl_certificate_key /etc/nginx/certs/replica.key;
    proxy_pass kamal-proxy:80;
  }
}

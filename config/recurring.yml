production:
  # Before cleanup_scenarios, deliberately: the sweep is what gives an abandoned
  # run a completed_at, and cleanup can only collect runs that have one.
  sweep_idle_scenarios:
    class: SweepIdleScenariosJob
    schedule: "0 2 * * *"
  # Between the sweep and cleanup, and that is load-bearing: the sweep settles
  # abandoned runs, this captures them, cleanup then deletes the old ones. Run
  # cleanup first and the abandonment history is lost rather than aggregated.
  roll_up_scenarios:
    class: RollUpScenariosJob
    schedule: "30 2 * * *"
  cleanup_scenarios:
    class: CleanupScenariosJob
    schedule: "0 3 * * *"
  cleanup_drafts:
    class: CleanupDraftsJob
    schedule: "0 3 * * *"
  # Uploads nothing attaches (an image removed before its step saved, or chosen
  # in an editor closed without saving) would otherwise stay in storage forever.
  # After the 03:00 cleanups so the two never compete; order doesn't matter.
  purge_unattached_blobs:
    class: PurgeUnattachedBlobsJob
    schedule: "30 3 * * *"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

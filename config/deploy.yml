# NOTE: this file is a TEMPLATE, not the live production config. The registry
# and host below are still the Rails-generated placeholders. The real Kamal
# config (with the actual registry, hosts and secrets) is kept OUTSIDE this
# repo. Changing a value here does not change production — mirror it into the
# out-of-repo config, or the deploy will not see it.

service: turboflows

image: your-registry/turboflows

servers:
  web:
    hosts:
      - your-server.com
    cmd: bin/rails server

env:
  clear:
    # The stacked runner: answering a step collapses it in place and appends the
    # next one below. See config/initializers/stacked_runner.rb — the flag has a
    # removal condition (two weeks of Player traffic with no rollback), and that
    # clock starts when this is first deployed with the flag on.
    # Rollback: set to 0 and redeploy. Rendering only; the state layer is
    # unconditional and is not undone by turning this off.
    STACKED_RUNNER: "1"
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_PASSWORD

volumes:
  - storage:/rails/storage

# Scheduler accessory removed — cleanup jobs now run via Solid Queue
# (in-process via puma plugin, configured in config/recurring.yml)


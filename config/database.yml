# config/database.yml
# -------------------------------------------------
# 1. Default settings (shared by dev / test)
# -------------------------------------------------
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# -------------------------------------------------
# 2. Development – uses SQLite (local file)
# -------------------------------------------------
development:
  primary:
    <<: *default
    database: db/development.sqlite3
  queue:
    <<: *default
    database: db/development_queue.sqlite3
    migrations_paths: db/queue_migrate

# -------------------------------------------------
# 3. Test – uses SQLite locally, PostgreSQL in CI
# -------------------------------------------------
# If DATABASE_URL is set, use PostgreSQL (for CI testing)
# Otherwise, use SQLite for fast local development
test:
  <% if ENV["DATABASE_URL"] %>
  primary:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 4 } %>
    # As in production (see below), so the PostgreSQL suite plans as it does.
    variables:
      plan_cache_mode: force_custom_plan
  queue:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 4 } %>
    migrations_paths: db/queue_migrate
    variables:
      plan_cache_mode: force_custom_plan
  <% else %>
  primary:
    <<: *default
    database: db/test.sqlite3
    timeout: 15000
    pragma:
      journal_mode: wal
  queue:
    <<: *default
    database: db/test_queue.sqlite3
    migrations_paths: db/queue_migrate
  <% end %>

# -------------------------------------------------
# 4. Production – PostgreSQL via DATABASE_URL
# -------------------------------------------------
# Pool size calculation:
# Each Puma worker needs its own connection pool
# Formula: RAILS_MAX_THREADS * WEB_CONCURRENCY = minimum pool size
# We add a small buffer for background tasks and ActionCable
#
# Example with defaults (5 threads * 2 workers = 10):
# - 10 connections per worker minimum
# - With 2 workers that's 20 total connections needed
# - Database should have at least 25-30 max_connections
#
# plan_cache_mode: a prepared statement goes generic on its sixth run on a
# connection, and a generic plan can't see how wide `started_at BETWEEN $1 AND
# $2` is. With index_scenarios_for_analytics it then fetched and sorted a whole
# 90-day range for an `ORDER BY id LIMIT` sample: 5 ms became 7-14 s, and a CSV
# export would do that per batch. Planning each run with its own values costs
# a fraction of a millisecond and keeps the statement cache.
production:
  primary:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i * ENV.fetch("WEB_CONCURRENCY", 2).to_i + 2 %>
    connect_timeout: 5
    prepared_statements: true
    advisory_locks: true
    reaping_frequency: 10
    variables:
      plan_cache_mode: force_custom_plan
  queue:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i * ENV.fetch("WEB_CONCURRENCY", 2).to_i + 2 %>
    connect_timeout: 5
    prepared_statements: true
    migrations_paths: db/queue_migrate
    variables:
      plan_cache_mode: force_custom_plan